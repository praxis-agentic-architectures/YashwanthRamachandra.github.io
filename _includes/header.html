<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="site-mark" aria-hidden="true">YR</span>
      <span>{{ site.title }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation.main %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
